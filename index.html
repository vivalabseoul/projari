<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>프로체어 MVP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 상단 역할 전환 바 + 역할별 서브탭 + 단일 작업 영역 (호스트가 기본 진입) */
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#141414; --muted:#6b6b6b; --line:#e4e4e4;
  --accent:#4a90e2; --accent-ink:#ffffff; --accent-soft:#f7f7f7; --gold:#4a90e2;
  --ok:#1f7a4d; --ok-soft:#e2f2e9; --warn:#8f5b00; --warn-soft:#fbf0d9; --bad:#b3261e; --bad-soft:#fbe4e2;
  --f-display:"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-body:"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0f0f; --surface:#181818; --ink:#f5f5f5; --muted:#a0a0a0; --line:#2c2c2c;
  --accent:#ff4d58; --accent-ink:#140404; --accent-soft:#222222; --gold:#ff4d58;
  --ok:#6fd39f; --ok-soft:#16301f; --warn:#e5b25a; --warn-soft:#33280f; --bad:#f08b84; --bad-soft:#3a1a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0f0f; --surface:#181818; --ink:#f5f5f5; --muted:#a0a0a0; --line:#2c2c2c;
  --accent:#ff4d58; --accent-ink:#140404; --accent-soft:#222222; --gold:#ff4d58;
  --ok:#6fd39f; --ok-soft:#16301f; --warn:#e5b25a; --warn-soft:#33280f; --bad:#f08b84; --bad-soft:#3a1a18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--f-display)}
h1{font-size:clamp(1.9rem,4.6vw,2.9rem);line-height:1.22;font-weight:800;letter-spacing:-.035em}
h2{font-size:1.5rem;line-height:1.32;font-weight:700;letter-spacing:-.028em}
h3{font-size:1.02rem;font-weight:700;letter-spacing:-.015em}
b,strong{font-weight:700}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 매장 사진 목록 */
.photo-list{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.photo-list li{display:grid;gap:4px;justify-items:start}
.photo-list img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);max-width:100%}
/* 업종별 이용 기준 */
.rules{width:100%;border-collapse:collapse;font-size:.86rem}
.rules th,.rules td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
.rules thead th{font-size:.76rem;color:var(--muted);font-weight:700;white-space:nowrap}
.rules tbody th{white-space:nowrap;font-weight:700}
.rules td:last-child{color:var(--muted);min-width:14em}
.rule-dl{display:grid;gap:8px;margin:0}
.rule-dl div{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:12px}
.rule-dl dt{color:var(--muted);font-size:.84rem}
.rule-dl dd{margin:0;font-size:.92rem}
@media (max-width:480px){.rule-dl div{grid-template-columns:1fr;gap:2px}}
/* Top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#141414}
.adbar{background:#141414;color:#f0f0f0;font-size:.8rem}
.adbar-in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:7px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.adbar button{background:none;border:0;color:inherit;cursor:pointer;padding:0;font-size:inherit}
.ad-msg{display:flex;align-items:center;gap:8px;min-width:0;text-align:left}
.ad-msg span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ad-msg:hover span:last-child{text-decoration:underline}
.ad-tag{flex:none;font-size:.62rem;font-weight:800;letter-spacing:.08em;color:#fff;background:#ff7a1a;border-radius:3px;padding:1px 5px}
.ad-host{flex:none;color:#ff7a1a !important;font-weight:700}
.ad-host:hover{text-decoration:underline}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.sub-in,main{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-size:1.4rem;font-weight:800;letter-spacing:-.045em;display:flex;align-items:baseline;gap:10px;color:var(--ink)}
.logo #brand::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:3px;vertical-align:.15em}
.logo .proto{letter-spacing:.02em}
.logo b{color:var(--accent)}
.proto{font-size:.72rem;letter-spacing:.06em;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:99px;font-weight:600}
.authbar{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.auth-btns{display:flex;gap:8px;align-items:center}
.hc-link{background:none;border:0;padding:0 2px;cursor:pointer;font-size:.74rem;color:var(--muted);letter-spacing:.01em}
.hc-link:hover{color:var(--accent)}
.who{display:flex;align-items:center;gap:8px;font-size:.88rem}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.8rem}
@media (max-width:720px){.roles{order:3;width:100%;margin-left:0;overflow-x:auto}.authbar{margin-left:auto}}
/* Home (marketplace) */
.home{display:grid;gap:34px}
.banner{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:21/8;min-height:190px;max-width:100%;background:#141414}
@media (max-width:640px){.banner{aspect-ratio:auto;min-height:220px}}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:0 clamp(20px,5vw,56px);color:#fff;cursor:pointer;border:0;text-align:left;width:100%;
  background:linear-gradient(95deg,rgba(10,9,8,.86),rgba(10,9,8,.55) 55%,rgba(10,9,8,.15)),url("salon.jpg") var(--pos,center)/cover no-repeat}
.slide b{font-size:clamp(1.4rem,3.6vw,2.3rem);font-weight:700;letter-spacing:-.035em;line-height:1.25}
.slide span{color:#ff7a1a;font-weight:500;font-size:.98rem}
.slide small{font-size:.72rem;letter-spacing:.2em;color:rgba(255,255,255,.7);font-weight:700}
.hero-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.hero-links button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:99px;padding:6px 14px;font-size:.88rem;cursor:pointer}
.hero-links button:hover{border-color:#ff7a1a;color:#ff7a1a}
.cats.use{grid-template-columns:repeat(5,minmax(0,1fr))}
.search{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:99px;padding:6px 6px 6px 22px;background:var(--surface)}
.search input{border:0;background:transparent;flex:1;min-width:0;padding:8px 0;font-size:1rem}
.search input:focus{outline:none}
.search:focus-within{box-shadow:0 0 0 3px var(--accent-soft)}
.search button{width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer;flex:none}
.search svg,.cat svg,.bnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cat-tabs{display:flex;gap:10px;align-items:center;font-weight:700;font-size:1.05rem;letter-spacing:-.02em}
.cat-tabs button{background:none;border:0;cursor:pointer;color:var(--muted);font-weight:700;padding:0}
.cat-tabs button[aria-pressed="true"]{color:var(--ink)}
.cat-tabs i{width:1px;height:14px;background:var(--line)}
.cats{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:18px 8px}
@media (max-width:640px){.cats{gap:12px 4px}.cats .cat{font-size:.62rem;gap:6px;white-space:nowrap;letter-spacing:-.05em}.cat .ic{width:auto;height:auto}.cat .ic svg{width:32px;height:32px}.cat .hot{font-size:.5rem;padding:0 3px}}
.cat{display:grid;justify-items:center;gap:8px;background:none;border:0;cursor:pointer;font-size:.86rem;position:relative;padding:0}
.cat .ic{width:auto;height:auto;border:0;border-radius:0;background:none;display:grid;place-items:center;color:var(--ink)}
.cat .ic svg{width:44px;height:44px;stroke-width:1.5}
.cat:hover .ic{color:var(--accent)}
.hot{position:absolute;top:-6px;left:calc(50% + 14px);background:#ff7a1a;color:#fff;font-size:.62rem;font-weight:800;padding:1px 6px;border-radius:99px;letter-spacing:.04em}
.row-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.row-head h2{font-size:1.18rem}
.more{background:none;border:0;cursor:pointer;color:var(--muted);font-size:.88rem;white-space:nowrap}
.more:hover{color:var(--ink)}
.hscroll{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.hscroll.c1{grid-template-columns:minmax(0,1fr)}.hscroll.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.hscroll.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:999px){.hscroll.c4{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:639px){.hscroll,.hscroll.c3,.hscroll.c4{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.hscroll.c1{grid-template-columns:minmax(0,1fr)}}
.mc{position:relative;min-width:0}
.mc-main{display:grid;gap:10px;background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%}
.mc-img{aspect-ratio:4/3;border-radius:12px;background:var(--img,url("salon.jpg")) center/cover no-repeat,#d9d4dc;position:relative;max-width:100%}
.mc-img .tag{position:absolute;top:10px;left:10px;background:rgba(20,16,24,.72);color:#fff;font-size:.72rem;padding:2px 8px;border-radius:99px}
.mc-img .tag.t2{top:auto;bottom:10px;background:#ff7a1a;color:#fff;font-weight:700}
.mc-b{display:grid;gap:2px}
.mc-b b.nm{font-size:1rem;letter-spacing:-.02em}
.heart{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.28);display:grid;place-items:center;cursor:pointer}
.heart svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.8}
.heart[aria-pressed="true"] svg{fill:#e8445a;stroke:#e8445a}
.band{border-radius:16px;background:#141414;color:#ffffff;padding:24px clamp(20px,4vw,40px);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border:0;width:100%;text-align:left;cursor:pointer}
.band b{font-size:1.2rem;letter-spacing:-.03em;color:#fff}
.band span{color:rgba(255,255,255,.7);font-size:.9rem}
.band em{font-style:normal;color:#ff7a1a;font-weight:700;white-space:nowrap}
body{overflow-x:clip}
.tint{background:var(--accent-soft);border-radius:0;margin-inline:calc(50% - 50vw);padding:28px calc(50vw - 50%);display:grid;gap:16px}
.foot{border-top:1px solid var(--line);padding-top:22px;display:grid;gap:12px;font-size:.8rem;color:var(--muted)}
.foot nav{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink);font-weight:500}
.biz{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0}
.biz div{display:flex;gap:6px}
.biz dt{color:var(--muted)}
.biz dd{margin:0;color:var(--ink)}
.foot nav button{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit}
.bnav{display:none}
@media (max-width:720px){
  .bnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bnav button{background:none;border:0;display:grid;justify-items:center;gap:2px;font-size:.7rem;color:var(--muted);cursor:pointer;padding:4px 0}
  .bnav button[aria-current="page"]{color:var(--ink);font-weight:700}
  main{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
}
/* Landing (premium) */
.lp{display:grid;gap:56px}
.lp-hero{position:relative;border-radius:18px;overflow:hidden;color:#ffffff;background:
  linear-gradient(100deg,rgba(10,9,8,.92) 0%,rgba(10,9,8,.78) 42%,rgba(10,9,8,.25) 100%),
  url("salon.jpg") center/cover no-repeat,#141414}
.lp-hero-in{padding:clamp(28px,6vw,72px) clamp(20px,5vw,64px);display:grid;gap:22px;max-width:640px}
.lp-eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.22em;color:#ff7a1a}
.lp-hero h1{font-weight:300;font-size:clamp(2.1rem,5.4vw,3.6rem);line-height:1.18;letter-spacing:-.04em;color:#fff}
.lp-hero h1 b{font-weight:700}
.lp-hero p{color:rgba(255,255,255,.78);font-size:1.04rem;max-width:30em}
.lp-cta{display:flex;gap:10px;flex-wrap:wrap}
.btn.gold{background:#4a90e2;border-color:#4a90e2;color:#fff}
.btn.gold:hover{filter:brightness(1.06);border-color:#4a90e2}
.btn.line{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
.btn.line:hover{border-color:#fff}
.lp-proof{display:flex;gap:22px;flex-wrap:wrap;padding-top:18px;border-top:1px solid rgba(255,255,255,.16);font-size:.86rem;color:rgba(255,255,255,.82)}
.lp-proof span::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#ff7a1a;margin-right:8px;vertical-align:.2em}
.lp-sec{display:grid;gap:22px}
.lp-kicker{font-size:.74rem;font-weight:700;letter-spacing:.2em;color:var(--accent)}
.lp-sec h2{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:300;letter-spacing:-.035em}
.lp-sec h2 b{font-weight:700}
.lp-cols{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:1px solid var(--ink)}
.lp-cols>div{padding:22px 22px 4px 0;display:grid;gap:8px;align-content:start}
.lp-cols>div:nth-child(even){padding-left:22px;border-left:1px solid var(--line)}.lp-cols>div:nth-child(n+3){border-top:1px solid var(--line)}
.lp-cols h3{font-size:1.08rem}
.lp-cols p{font-size:.92rem;color:var(--muted)}
.lp-tag{font-size:.72rem;font-weight:700;letter-spacing:.14em;color:var(--accent)}
@media (max-width:860px){.lp-cols{grid-template-columns:1fr}.lp-cols>div:nth-child(even){padding-left:0;border-left:0}.lp-cols>div+div{border-top:1px solid var(--line)}}
.lp-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:lps;margin:0;padding:0}
.lp-steps li{list-style:none;display:grid;gap:6px;counter-increment:lps;padding-top:16px;border-top:2px solid var(--line);position:relative}
.lp-steps li::before{content:"0" counter(lps);font-size:.8rem;font-weight:700;letter-spacing:.1em;color:var(--accent)}
.lp-steps li:first-child{border-top-color:var(--gold)}
.lp-steps span{font-size:.9rem;color:var(--muted)}
@media (max-width:860px){.lp-steps{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.lp-steps{grid-template-columns:1fr}}
.lp-split{display:grid;grid-template-columns:.9fr 1.1fr;gap:40px;align-items:start}
@media (max-width:860px){.lp-split{grid-template-columns:1fr;gap:20px}}
.lp-end{border-radius:18px;background:#141414;color:#ffffff;padding:clamp(28px,5vw,52px);display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.lp-end h2{color:#fff;font-weight:300;font-size:clamp(1.4rem,3vw,2rem);letter-spacing:-.035em}
.lp-end h2 b{font-weight:700}
.lp-end p{color:rgba(255,255,255,.7);font-size:.9rem}

.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:32px;align-items:center;padding-block:12px 8px}
.hero .eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.hero p.lead{font-size:1.06rem;color:var(--muted);max-width:34em}
.hero-img{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:url("salon.jpg") center/cover no-repeat,#d9d4dc}
.float{position:absolute;left:16px;right:16px;bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;counter-reset:st}
.steps li{list-style:none;display:grid;gap:6px;counter-increment:st}
.steps li::before{content:counter(st);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:.86rem}
@media (max-width:860px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}
.steps-wrap{margin:0;padding:0}
details{border-bottom:1px solid var(--line);padding:14px 0}
details:last-child{border-bottom:0}
summary{cursor:pointer;font-weight:700;letter-spacing:-.015em}
details p{margin-top:8px;color:var(--muted);font-size:.94rem}
/* Auth */
.auth{max-width:460px;width:100%;margin:0 auto;display:grid;gap:18px}
.stepper{display:flex;gap:6px}
.stepper span{flex:1;height:4px;border-radius:99px;background:var(--line)}
.stepper span.on{background:var(--accent)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:18px 14px;text-align:left;cursor:pointer;display:grid;gap:4px}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.kakao{background:#fee500;color:#191600;border-color:#fee500}
.err{color:var(--bad);font-size:.84rem}
.brand-btn{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit}
.roles{margin-left:auto;display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:99px;border:1px solid var(--line)}
.roles button{border:0;background:none;padding:6px 16px;border-radius:99px;cursor:pointer;font-weight:500;color:var(--muted)}
.roles button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sub{border-top:1px solid var(--line)}
.sub-in{display:flex;gap:4px;overflow-x:auto;padding-block:6px}
.sub button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500}
.sub button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.sub .cnt{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;text-align:center}
main{padding-block:24px 64px;display:grid;gap:20px}

/* Generic */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.stars-txt{color:#ff7a1a;letter-spacing:1px}
.stars{display:flex;gap:4px}.stars button{background:none;border:0;cursor:pointer;font-size:1.9rem;line-height:1;color:var(--line);padding:2px}.stars button.on{color:#ff7a1a}

      :`<div class="sum num"><div><span>${won(unitP)} × ${unitLabel(F.unit,F.qty)}</span><span>${won(total)}</span></div><div class="muted small"><span>이용 시간</span><span>${F.time} ~ ${endOf(F.time,s.dayHours)}</span></div><div class="muted small"><span>플랫폼 수수료는 호스트 정산에서 차감</span><span>게스트 부담 0원</span></div><div class="tot"><span>결제 금액</span><span>${won(total)}</span></div></div>`}
      <button class="btn pri payred" type="submit" ${hasLic&&ownOk&&!clash?'':'disabled'}>${F.unit!=='day'?'입점 신청하고 첫 달 결제':'결제하고 예약 요청'}</button>
      <p class="small muted">원장님이 수락하면 확정됩니다. 거절 시 전액 환불됩니다.</p>

/* ===== 후기 ===== */
function reviewSection(s){
  const l=rvOf(s), avg=l.length?(l.reduce((a,r)=>a+r.rating,0)/l.length).toFixed(1):null;
  return `<section class="panel stack"><div class="row" style="align-items:center;gap:8px"><h3 style="flex:1 1 auto">이용 후기</h3>${avg?`<span class="num"><b class="stars-txt">★</b> <b>${avg}</b> <span class="small muted">· ${l.length}개</span></span>`:''}</div>
    ${l.length?l.map(r=>`<div class="rv"><div class="row" style="align-items:center;gap:8px"><b>${esc(maskName(r.guest))}</b><span class="stars-txt small" aria-label="별점 ${r.rating}점">${starTxt(r.rating)}</span><span class="small muted num" style="margin-left:auto">${r.date}</span></div>
      <p class="small" style="margin:6px 0 0">${esc(r.text)}</p>
      ${r.reply?`<div class="rv-reply"><b class="small">원장님 답글</b><p class="small" style="margin:2px 0 0">${esc(r.reply)}</p></div>`:''}</div>`).join(''):'<p class="small muted">아직 후기가 없습니다. 이용을 마친 디자이너만 후기를 남길 수 있습니다.</p>'}
    <p class="small muted">후기는 이용을 완료한 예약에 한해 작성할 수 있습니다.</p></section>`;
}
function reviewAction(b){
  const done=reviews.find(r=>r.bid===b.id);
  return done ? `<span class="pill p-ok" style="justify-self:start">후기 작성 완료 ${starTxt(done.rating)}</span>`
              : `<div><button class="btn sm" data-rv="open" data-id="${b.id}">후기 작성</button></div>`;
}
function reviewDialog(){
  const R=S.rv, b=bookings.find(x=>x.id===R.bid), s=sp(b.spaceId);
  $('#layer').innerHTML=`<div class="ovl" role="dialog" aria-modal="true" aria-labelledby="rvh"><div class="dlg">
    <h3 id="rvh">후기 작성</h3><p class="small muted">${esc(s.name)} · ${b.start} 이용</p>
    <div class="stars" role="group" aria-label="별점 선택">${[1,2,3,4,5].map(n=>`<button type="button" data-rv="star" data-n="${n}" class="${n<=R.rating?'on':''}" aria-label="${n}점" aria-pressed="${n<=R.rating}">★</button>`).join('')}</div>
    <div class="field"><label for="rv-text">이용 후기 (10자 이상)</label><textarea id="rv-text" rows="4" maxlength="300" placeholder="공간 상태, 시설, 원장님 응대 등 실제 이용 경험을 적어주세요">${esc(R.text)}</textarea></div>
    <p class="small muted">작성한 후기는 공간 상세에 공개되며, 이름은 일부 가려서 표시됩니다.</p>
    <div class="row"><button class="btn" data-rv="cancel">취소</button><button class="btn pri" data-rv="submit">등록</button></div></div></div>`;
}
function hostReviews(){
  const my=reviews.filter(r=>sp(r.spaceId).host===ME_HOST).sort((a,b)=>(a.reply?1:0)-(b.reply?1:0)||b.date.localeCompare(a.date));

    <div class="row" style="align-items:center;gap:8px"><b>${esc(sp(r.spaceId).name)}</b><span class="stars-txt small">${starTxt(r.rating)}</span><span class="small muted">${esc(maskName(r.guest))} · ${r.date}</span>${r.reply?'':'<span class="pill p-warn">답글 대기</span>'}</div>
    <p class="small" style="margin:0">${esc(r.text)}</p>
    ${r.reply?`<div class="rv-reply"><b class="small">내 답글</b><p class="small" style="margin:2px 0 0">${esc(r.reply)}</p></div>`
    :`<div class="field"><label class="vh" for="rp-${r.id}">답글</label><textarea id="rp-${r.id}" rows="2" maxlength="200" placeholder="디자이너에게 남길 답글"></textarea><div><button class="btn pri sm" data-rv="reply" data-id="${r.id}">답글 등록</button></div></div>`}
  </div></div>`).join(''):'<div class="empty">아직 받은 후기가 없습니다.</div>'}</section>`;

function accessInfo(b,s){
  const addr=(s.addr&&(b.status==='확정'||b.status==='완료'))?`<p class="small">주소 <b>${esc(s.addr)}</b> <span class="muted">· 확정된 예약에만 공개</span></p>`:'';
  return addr+accessInfo0(b,s);
}
function accessInfo0(b,s){
  if(!s.code) return '<p class="small muted">출입은 원장님과 직접 협의합니다</p>';
  return (b.status==='확정'||b.status==='완료') ? `<p class="small">출입 정보 <b class="num">${esc(s.code)}</b> <span class="muted">· 확정된 예약에만 공개</span></p>` : '<p class="small muted">출입 정보는 예약이 확정되면 공개됩니다</p>';
}
/* 내 예약 달력 */
function bookingRange(b){
  const [y,m,d]=b.start.split('-').map(Number); const a=Date.UTC(y,m-1,d);
  const e = b.unit==='day' ? Date.UTC(y,m-1,d+b.qty-1) : Date.UTC(y,m-1+b.qty*MONTHS[b.unit],d-1);
  return [a,e];
}
function mineCal(list){
  const now=new Date(); const ym=S.mineMonth||(list.length?list.map(b=>b.start).sort().slice(-1)[0].slice(0,7):`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`);
  const [Y,M]=ym.split('-').map(Number); const first=Date.UTC(Y,M-1,1), dim=new Date(Y,M,0).getDate(), lead=new Date(Y,M-1,1).getDay();
  const ranges=list.filter(b=>b.status!=='거절').map(b=>({b,r:bookingRange(b)}));
  const cells=[]; for(let i=0;i<lead;i++) cells.push('<div class="cd off"></div>');
  for(let d=1;d<=dim;d++){
    const t=Date.UTC(Y,M-1,d); const ev=ranges.filter(x=>x.r[0]<=t&&t<=x.r[1]);
    cells.push(`<div class="cd${ev.length?' has':''}"><span class="n">${d}</span>${ev.slice(0,2).map(x=>`<i class="ev e-${x.b.status}">${esc(sp(x.b.spaceId).name)}</i>`).join('')}${ev.length>2?`<em>+${ev.length-2}</em>`:''}</div>`);
  }
  const prev=new Date(Date.UTC(Y,M-2,1)).toISOString().slice(0,7), next=new Date(Date.UTC(Y,M,1)).toISOString().slice(0,7);
  return `<section class="panel cal"><div class="cal-h"><button class="btn sm" data-mmonth="${prev}" aria-label="이전 달">‹</button><b>${Y}년 ${M}월</b><button class="btn sm" data-mmonth="${next}" aria-label="다음 달">›</button></div>
  <div class="cal-g">${['일','월','화','수','목','금','토'].map(w=>`<div class="wd">${w}</div>`).join('')}${cells.join('')}</div>
  <div class="cal-l"><span><i class="ev e-요청"></i>호스트 확인 중</span><span><i class="ev e-확정"></i>확정</span><span><i class="ev e-완료"></i>이용 완료</span></div></section>`;
}
function guestMine(){
  const list=bookings.filter(b=>b.guest===ME_GUEST.name);
  const view=S.mineView||'list';
  return `<div class="head"><h2>내 예약</h2><div class="seg"><button data-mview="list" aria-pressed="${view==='list'}">목록</button><button data-mview="cal" aria-pressed="${view==='cal'}">달력</button></div></div>
  ${view==='cal'?mineCal(list):''}
  <section class="panel">${list.length?list.map(b=>{const s=sp(b.spaceId);return `<div class="req"><div class="stack" style="gap:4px"><div class="row" style="align-items:center;gap:8px"><h3 style="flex:none">${esc(s.name)}</h3><span class="pill ${statusPill(b.status)}">${b.status==='요청'?'호스트 확인 중':b.status}</span></div><div class="meta num"><span>${b.start} 시작 · ${unitLabel(b.unit,b.qty)}${b.unit==='day'?` · ${b.time}~${endOf(b.time,s.dayHours)}`:''}</span><span>·</span><span>${esc(b.gType)}</span><span>·</span><span>${contractLabel(b.contract)}</span>${b.unit!=='day'?`<span>·</span><span>${b.unit==='year'?'매월 분납 결제':'매월 월세 결제'}</span>`:''}</div>${accessInfo(b,s)}${b.status==='완료'?reviewAction(b):''}</div><b class="num">${won(amountOf(b))}</b></div>`}).join(''):'<div class="empty">아직 예약이 없습니다. 공간 찾기에서 첫 예약을 해보세요.<div style="margin-top:12px"><button class="btn pri sm" data-go="guest:search">공간 찾기</button></div></div>'}</section>`;
}

/* ===== 관리자 ===== */
function matchInfo(v){
  if(v.target==='회원가입') return {ok:true,txt:'큐넷 진위확인 대조 필요'};
  if(v.kind==='호스트') return {ok:true,txt:'신고증 업종 확인 필요'};
  const m = v.target.match(/\((.+)\)/); const allowed = m? m[1].split(', '):[]; const ok = v.types.every(t=>allowed.includes(t));
  return {ok, txt: ok?'매장 신고 업종과 일치':'매장 신고 업종에 없음'};
}
function adminVerify(){
  const tabs=['대기','승인','반려']; const list=verifs.filter(v=>v.status===S.adminTab);
  return `<div class="head"><h2>자격·신고증 인증</h2><div class="seg">${tabs.map(t=>`<button data-atab="${t}" aria-pressed="${S.adminTab===t}">${t} ${verifs.filter(v=>v.status===t).length}</button>`).join('')}</div></div>
  <section class="panel"><div class="tbl-wrap"><table><thead><tr><th>제출일</th><th>구분</th><th>이름</th><th>제출 서류</th><th>대상 매장 (신고 업종)</th><th>업종 검증</th><th class="r">처리</th></tr></thead><tbody>
  ${list.length?list.map(v=>{const m=matchInfo(v);return `<tr><td class="num">${v.date}</td><td><span class="pill p-mut">${v.kind}</span></td><td>${esc(v.who)}</td><td>${esc(v.doc)}</td><td>${esc(v.target)}</td><td><span class="pill ${m.ok?'p-ok':'p-bad'}">${m.txt}</span></td><td class="r" style="white-space:nowrap">${v.status==='대기'?`<button class="btn sm" data-vact="반려" data-id="${v.id}">반려</button> <button class="btn pri sm" data-vact="승인" data-id="${v.id}">승인</button>`:`<span class="pill ${statusPill(v.status)}">${v.status}${v.reason?' · '+esc(v.reason):''}</span>`}</td></tr>`}).join(''):`<tr><td colspan="7" class="empty">${S.adminTab} 항목이 없습니다.</td></tr>`}
  </tbody></table></div></section>
  <p class="note">업종 검증 규칙: 게스트가 시술할 업종이 호스트의 영업신고 업종에 포함되어야 합니다. 각자 영업신고 게스트는 본인 신고증도 함께 확인합니다. 반영구·SMP는 문신사 면허 확인이 필요하며, 법 시행 전에는 승인해도 사전 접수 상태로 유지됩니다.</p>`;

/* ===== 관리자: 입금확인 · 정산확인 (상태 분리) ===== */
const PG_COST = { '카드': a => a*0.034*1.1, '가상계좌': () => 440 };   /* 토스페이먼츠 공시 요금 기준(VAT 포함), 계약 조건에 따라 다름 */
function payRow(l){
  const base=l.rent+(l.ops||0), dep=l.first?l.deposit:0, bill=base+dep;
  const paid=l.thisMonth==='결제 완료', fee=base*CONFIG.fee.month;
  const payout=paid?base-fee+dep:0;
  const deposit=paid?'입금 확인':(l.thisMonth==='미납'?'미입금':'입금 대기');
  const settle=!paid?'정산 대상 아님':l.settle;
  const recon=!paid?(l.thisMonth==='미납'?'확인 필요 · 미입금':'대기'):'일치';
  const pg=paid?PG_COST[l.method](base)+(l.first?PG_COST['가상계좌']():0):0;   /* 보증금은 별도 가상계좌 1건 */
  return {base,dep,bill,paid,fee,payout,deposit,settle,recon,pg};
}

function authSubmit(){
  const A=S.auth; A.err='';
  const codeErr = () => !phoneOk(A.phone) ? '휴대폰 번호를 확인해 주세요. 예: 010-1234-5678' : !A.sent ? '인증번호 받기를 먼저 눌러 주세요.' : A.code!==DEMO_CODE ? '인증번호가 맞지 않습니다. 다시 확인해 주세요.' : '';
  if(A.mode==='login'){
    A.err = codeErr(); if(A.err) return render();
    const acc = ACCOUNTS.find(a=>a.phone===digits(A.phone));
    if(!acc){ A.err='가입되지 않은 번호입니다. 회원가입을 먼저 해주세요.'; return render(); }
    return loginAs(acc);
  }
  if(A.step===0 && !A.type) A.err='회원 유형을 골라 주세요.';
  if(A.step===1) A.err = !A.name.trim() ? '이름을 입력해 주세요.' : codeErr() || (ACCOUNTS.some(a=>a.phone===digits(A.phone)) ? '이미 가입된 번호입니다. 로그인해 주세요.' : '');
  if(A.step===2) A.err = !A.quals.length ? '보유 자격 종목을 하나 이상 골라 주세요.'
    : A.qform==='book' ? (!/^\d{8}$/.test(A.birth)?'생년월일 8자리를 숫자로 입력해 주세요. 예: 19940512':!A.qno.trim()?'자격증 번호를 입력해 주세요.':!A.qdate?'발급일을 입력해 주세요.':!A.qpage.trim()?'자격증 내지번호를 입력해 주세요.':'')
    : (!A.qmng.trim()?'자격증 관리번호를 입력해 주세요.':'');
  if(A.step===3 && A.type==='host'){ const over=A.types.filter(t=>!PENDING_TYPES.includes(t)&&!qualTypes(A.quals).includes(t));
    A.err = !A.store.trim()?'매장 이름을 입력해 주세요.':!A.types.length?'영업신고 업종을 하나 이상 골라 주세요.':over.length?`${over.join(', ')} 업종은 보유 자격에 없습니다. 해당 자격을 추가하거나 업종을 빼 주세요.`:''; }
  if(A.step===4 && !(A.agree.tos&&A.agree.priv&&A.agree.efin)) A.err='필수 약관에 모두 동의해 주세요.';
  if(A.err) return render();
  if(A.step===4){
    const qdoc = `국가기술자격 ${qualLabels(A.quals).join('·')} (${A.qform==='book'?'수첩형 · 번호 '+A.qno.trim():'상장형 · 관리번호 '+A.qmng.trim()})`;
    ACCOUNTS.push({phone:digits(A.phone),name:A.name.trim(),type:A.type});
    verifs.unshift({id:Date.now(),who:A.type==='host'?`${A.store.trim()} (${A.name.trim()})`:A.name.trim(),kind:A.type==='host'?'호스트':'게스트',
      doc: qdoc + (A.type==='host'?' · 미용업 영업신고증':(A.own?' · 본인 영업신고증':'')),
      types:A.type==='host'?[...A.types]:qualTypes(A.quals),target:'회원가입',date:'2026-10-30',status:'대기'});
    if(A.type==='guest'){ Object.assign(ME_GUEST,{name:A.name.trim(),licenses:qualTypes(A.quals),ownReport:A.own,verified:false}); }
  }
  A.step++; render();
}
function loginAs(acc){
  S.user={name:acc.name,type:acc.type}; S.auth=null; S.sel=null;
  if(acc.type==='guest' && acc.phone==='01033334444') Object.assign(ME_GUEST,{name:'김지원',licenses:['헤어','속눈썹','메이크업'],ownReport:false,verified:true});
  S.role=acc.type; S.tab[acc.type]= acc.type==='host'?'dash':'search'; render(); scrollTo(0,0); toast(`${acc.name}님, 로그인했습니다`);
}

  if(t.dataset.act){ const b=bookings.find(x=>x.id===+t.dataset.id); const ok=t.dataset.act==='accept'; b.status=ok?'확정':'거절';
    if(ok && b.unit!=='day'){ const s=sp(b.spaceId); leases.push({id:Date.now(),spaceId:b.spaceId,guest:b.guest,gType:b.gType,unit:b.unit,rent:b.unit==='year'?Math.round((b.price??pYear(s))/12):(b.price??s.month),deposit:s.deposit,ops:s.ops||0,start:b.start,months:b.qty*MONTHS[b.unit],payDay:+b.start.slice(8),thisMonth:'결제 완료',method:'가상계좌',paidAt:TODAY+' (예시)',settle:'정산 보류',settleAt:'입주 확인 후',first:true}); }
    toast(ok?(b.unit!=='day'?`${b.guest} 디자이너 입점을 확정했습니다. 월세 관리에 추가됐습니다`:`${b.guest} 디자이너 예약을 확정했습니다`):'요청을 거절하고 전액 환불했습니다'); render(); return; }
  if(t.dataset.lact){ const l=leases.find(x=>x.id===+t.dataset.id);
    if(t.dataset.lact==='remind'){ l.thisMonth='알림 발송'; toast(`${l.guest} 디자이너에게 납부 알림을 보냈습니다 (예시)`); }

  if(t.dataset.vact){ const v=verifs.find(x=>x.id===+t.dataset.id); v.status=t.dataset.vact; if(v.status==='반려') v.reason='업종 불일치';
    if(v.kind==='게스트'&&v.target==='회원가입'&&v.who===ME_GUEST.name&&v.status==='승인') ME_GUEST.verified=true;
    if(v.spaceId&&v.status==='승인'){ const s=sp(v.spaceId); s.status=hasPending(s.types)?'사전 접수':'공개'; }
    toast(`${v.who} ${v.status} 처리했습니다`); render(); return; }
  if(t.dataset.more){ const i=t.dataset.more; S.more[i]=(S.more[i]||1)+1; render(); return; }
  if(t.dataset.rv){ const a=t.dataset.rv;
    if(a==='open'){ S.rv={bid:+t.dataset.id,rating:0,text:''}; reviewDialog(); return; }
    if(a==='cancel'){ $('#layer').innerHTML=''; return; }

    if(a==='submit'){ const text=$('#rv-text').value.trim(); S.rv.text=text;
      if(!S.rv.rating){ toast('별점을 선택해 주세요'); return; }

/* ===== 매장 사진: 최대 장수·용량 제한, 초과 용량은 브라우저에서 축소 ===== */
const readURL = blob => new Promise((ok,no)=>{ const fr=new FileReader(); fr.onload=()=>ok(fr.result); fr.onerror=no; fr.readAsDataURL(blob); });
const loadImg = url => new Promise((ok,no)=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=no; im.src=url; });
const toBlob = (c,q) => new Promise(ok=>c.toBlob(ok,'image/jpeg',q));
async function fitPhoto(file){
  const limit=CONFIG.photo.maxKB*1024;
  if(file.size<=limit) return {url:await readURL(file), kb:file.size/1024};
  const im=await loadImg(await readURL(file));
  let side=1600;
  for(let round=0; round<6; round++){
    const k=Math.min(1, side/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    for(const q of [0.82,0.7,0.58,0.46]){ const b=await toBlob(c,q); if(b&&b.size<=limit) return {url:await readURL(b), kb:b.size/1024, shrunk:true}; }
    side=Math.round(side*0.75);
  }
  return null;
}
document.addEventListener('change', async e=>{
  const el=e.target; if(!el.dataset || el.dataset.photos===undefined) return;
  const room=CONFIG.photo.max-S.reg.photos.length, files=[...el.files];
  if(!files.length) return;
  if(files.length>room) toast(`사진은 최대 ${CONFIG.photo.max}장입니다. 앞의 ${room}장만 올립니다`);
  let shrunk=0, failed=0;
  for(const f of files.slice(0,room)){
    if(!f.type.startsWith('image/')){ failed++; continue; }
    try{ const r=await fitPhoto(f); if(r){ S.reg.photos.push(r); if(r.shrunk) shrunk++; } else failed++; }catch(_){ failed++; }
  }
  render(); document.getElementById('r-photos')?.focus();
  if(failed) toast(`${failed}장은 ${CONFIG.photo.maxKB}KB 이하로 줄이지 못해 제외했습니다. 다른 사진을 골라 주세요`);
  else if(shrunk) toast(`${shrunk}장을 ${CONFIG.photo.maxKB}KB 이하로 줄여 올렸습니다`);
});
